<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Feed da Dani · Estilo com Alma</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&family=Great+Vibes&display=swap">
<style>
html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* Layout: capa editorial no topo (mini calendário à esquerda, título da proposta ao centro); seções como "slides" da proposta: sobrancelha dourada, título Playfair com itálico, fio dourado, listas numeradas e telas café com pérola. */
:root{
  --bg:#F7F1E6; --bg2:#EFE4D0; --paper:#FFFBF4; --paper2:#FBF6EC; --ink:#3A2614; --ink2:#5C4632; --muted:#7A6248;
  --line:#E2D2B6; --hair:#D9C4A0; --gold:#8A5C22; --gold2:#C9A063; --gold3:#9A6A2C; --chip:#EFE4D0; --chipink:#7A4E18;
  --cafe:#2B1D12; --cafe2:#3A2614; --cafe-ink:#F3E6D0; --cafe-muted:#CDB898; --cafe-gold:#D9B27A; --cafe-line:#5A4430;
  --scrim:rgba(43,29,18,.42);
  --st-ideia:#A39581; --st-producao:#B5822F; --st-revisao:#86659F; --st-aprovado:#4F8A63; --st-publicado:#3A2614; --danger:#A3412E;
  --display:'Playfair Display', Georgia, 'Times New Roman', serif; --ui:'Jost', 'Segoe UI', Arial, sans-serif; --script:'Great Vibes', 'Brush Script MT', cursive;
  --ig:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; --bio:'Times New Roman', Georgia, serif;
  --phone-bg:#FFFFFF; --phone-ink:#0F0F0F; --phone-muted:#737373; --phone-line:#EFEFEF; --phone-link:#00376B;
  --lift:0 24px 60px rgba(90,62,30,.16);
}
:root,:root[data-theme="dark"]{color-scheme:light}
*{box-sizing:border-box}
body{background:radial-gradient(ellipse 80% 50% at 85% 0%, var(--paper) 0%, transparent 70%), var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.55;font-weight:400;-webkit-font-smoothing:antialiased;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;color:var(--ink);letter-spacing:-.005em}
h1 i,h2 i,h3 i{font-style:italic;color:var(--gold3)}
.eyebrow{font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:500}
.script{font-family:var(--script);color:var(--gold3);line-height:1.15}
.muted{color:var(--muted)}
.rule{height:1px;background:var(--hair);border:0;margin:0}
.rule.gold{background:linear-gradient(90deg,var(--gold2),transparent)}

/* ===== Capa ===== */
.cover{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.cover .wrap{position:relative;display:grid;grid-template-columns:286px minmax(0,1fr) auto;gap:20px 40px;align-items:center;padding-block:28px 26px}
@media (max-width:900px){.cover .wrap{grid-template-columns:minmax(0,1fr);gap:20px}.cover .meta{order:-1;justify-content:flex-start}}
.brand .eyebrow{display:block;margin-bottom:10px}
.brand h1{font-size:clamp(34px,4.6vw,56px);line-height:1.02}
.brand .script{font-size:clamp(24px,2.6vw,32px);margin-top:8px}
.meta{display:flex;flex-direction:column;gap:8px;align-items:flex-end;align-self:start}
.pill{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;letter-spacing:.04em;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 80%,transparent);color:var(--ink2);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--st-ideia)}
.dot.live{background:var(--st-aprovado);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--st-aprovado) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.orn{position:absolute;pointer-events:none}
.pearl{position:absolute;border-radius:50%;background:radial-gradient(circle at 34% 28%,#FFFFFF 0%,#F4ECE0 30%,#DCCBB2 70%,#C3AE90 100%);box-shadow:inset -4px -6px 10px rgba(120,90,50,.18),6px 14px 26px rgba(120,90,50,.26);pointer-events:none}

/* Mini calendário (abre o calendário completo) */
.mini{view-transition-name:calhero;width:100%;max-width:286px;text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--paper) 92%,transparent);border-radius:22px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;color:var(--ink);
  box-shadow:0 14px 40px rgba(90,62,30,.12);animation:float 7s ease-in-out infinite;transition:box-shadow .3s, transform .45s cubic-bezier(.34,1.45,.64,1)}
.mini:hover{transform:scale(1.03);box-shadow:var(--lift)}
.mini:active{transform:scale(.985)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -5px}}
.mini.gone{visibility:hidden;view-transition-name:none;animation:none}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mh .mm{font-family:var(--display);font-size:20px;line-height:1}
.mh .mm i{color:var(--gold3)}
.mh .mc{font-size:11.5px;color:var(--muted);letter-spacing:.04em}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-variant-numeric:tabular-nums}
.mg .w{font-size:10px;letter-spacing:.14em;color:var(--muted);padding-bottom:2px}
.mg .c{font-size:12.5px;width:29px;height:29px;margin:0 auto;display:flex;align-items:center;justify-content:center;border-radius:50%;transition:transform .35s cubic-bezier(.34,1.45,.64,1),background .3s,color .3s,box-shadow .3s}
.mg .c.past{color:var(--muted);opacity:.7}
.mg .c.has{background:color-mix(in srgb,var(--tint) 22%,transparent);font-weight:500}
.mg .c.comm{box-shadow:inset 0 0 0 1px var(--gold2)}
.mg .c.today{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:600}
.mg .c.glow{background:var(--tint);color:#fff;font-weight:600;transform:scale(1.18);box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 25%,transparent),0 4px 14px color-mix(in srgb,var(--tint) 55%,transparent)}
.mcap{display:flex;gap:8px;align-items:baseline;min-height:40px;padding:8px 4px 0;border-top:1px solid var(--line);transition:opacity .3s, transform .3s}
.mcap.swap{opacity:0;transform:translateY(4px)}
.mcap .d{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);white-space:nowrap;font-weight:500}
.mcap .n{font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mcap .n em{color:var(--muted)}

/* Abas numeradas */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:30px;overflow-x:auto;scrollbar-width:none}
.tabs a{display:flex;align-items:baseline;gap:10px;padding:15px 0 13px;color:var(--muted);text-decoration:none;border-bottom:1.5px solid transparent;white-space:nowrap;font-size:15px;letter-spacing:.02em;transition:color .2s}
.tabs a b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--gold2)}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.tabs a[aria-current="page"] b{color:var(--gold)}
main{padding-block:34px 80px;position:relative}

/* Cabeça de seção, como os slides */
.sh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;margin-bottom:26px}
@media (max-width:700px){.sh{grid-template-columns:minmax(0,1fr)}}
.sh .eyebrow{display:block;margin-bottom:10px}
.sh h2{font-size:clamp(32px,4.4vw,50px);line-height:1.05}
.sh p{margin:12px 0 0;color:var(--ink2);max-width:62ch}
.sh .rule{grid-column:1/-1;margin-top:4px}
.sh .acts{display:flex;gap:10px;flex-wrap:wrap}

/* Botões e campos */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--hair);background:transparent;color:var(--ink);border-radius:8px;padding:9px 18px;min-height:42px;letter-spacing:.02em;transition:background .2s,border-color .2s,color .2s,transform .15s}
.btn:hover{border-color:var(--gold2);background:color-mix(in srgb,var(--paper) 70%,transparent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--cafe2);border-color:var(--cafe2);color:var(--cafe-ink)}
.btn.primary:hover{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.small{min-height:34px;padding:5px 13px;font-size:14px}
.btn.ghost{border-color:transparent}
.btn.danger{color:var(--danger);border-color:transparent}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.iconbtn{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid var(--hair);background:transparent;color:var(--ink);font-size:16px}
.iconbtn:hover{border-color:var(--gold2);background:var(--paper)}
.iconbtn:disabled{opacity:.3;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.03em;padding:3px 11px;border-radius:999px;background:var(--chip);color:var(--chipink);white-space:nowrap}
.st{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;white-space:nowrap;color:var(--ink2);letter-spacing:.02em}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st-ideia{--c:var(--st-ideia)}.st-producao{--c:var(--st-producao)}.st-revisao{--c:var(--st-revisao)}.st-aprovado{--c:var(--st-aprovado)}.st-publicado{--c:var(--st-publicado)}
.lbl{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:8px}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=number],input[type=search],select,textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:42px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold2);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold2) 22%,transparent)}
textarea{resize:vertical;line-height:1.6}
.tip{font-size:13px;color:var(--muted);margin:0;line-height:1.5}
.notice{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:22px 24px;color:var(--ink2)}
.notice h3{font-size:24px;margin-bottom:6px}
.ro .w-only{display:none!important}
.seg{display:inline-flex;border:1px solid var(--hair);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 16px;min-height:34px;border-radius:999px;color:var(--ink2);letter-spacing:.02em}
.seg button[aria-pressed="true"]{background:var(--cafe2);color:var(--cafe-ink)}
.skel{height:300px;border-radius:16px;background:linear-gradient(90deg,var(--paper) 0%,var(--paper2) 50%,var(--paper) 100%);background-size:200% 100%;animation:sh 1.4s infinite;border:1px solid var(--line)}
@keyframes sh{to{background-position:-200% 0}}

/* ===== 01 Posts ===== */
.figs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:26px}
@media (max-width:760px){.figs{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.figs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fig{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:14px 16px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink);transition:border-color .2s,transform .2s}
.fig:hover{border-color:var(--gold2);transform:translateY(-2px)}
.fig b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;color:var(--gold3);font-variant-numeric:tabular-nums}
.fig[aria-pressed="true"]{background:var(--cafe2);border-color:var(--cafe2);color:var(--cafe-ink)}
.fig[aria-pressed="true"] b{color:var(--cafe-gold)}
.fig[aria-pressed="true"] .st{color:var(--cafe-ink)}
.toolbar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar .search{flex:1 1 240px;max-width:380px;border-radius:999px;padding-left:18px}
.nextup{margin-left:auto;display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--ink2)}
.nextup .eyebrow{letter-spacing:.24em;font-size:10.5px}
.nextup b{font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,224px),1fr));gap:22px 18px}
@media (max-width:560px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 10px}}
.pcard{display:flex;flex-direction:column;text-align:left;border:0;background:transparent;padding:0;color:var(--ink)}
.pcard .cv{position:relative;aspect-ratio:4/5;background:var(--bg2);overflow:hidden;border-radius:14px;border:1px solid var(--line);transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.pcard:hover .cv{transform:translateY(-4px);box-shadow:var(--lift)}
.pcard .cv img,.pcard .cv video{width:100%;height:100%;object-fit:cover;display:block}
.pcard .cv .tp{position:absolute;top:10px;left:10px;background:rgba(255,251,244,.93);color:#3A2614;border-radius:999px;padding:3px 11px;font-size:11.5px;letter-spacing:.04em;display:flex;gap:6px;align-items:center}
.pcard .cv .tp svg{width:13px;height:13px}
.pcard .num{font-family:var(--display);font-size:13px;color:var(--gold2);margin-top:12px;letter-spacing:.06em}
.pcard .t{font-family:var(--display);font-size:20px;line-height:1.22;margin-top:2px}
.pcard .meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}
.pcard .pil{font-family:var(--display);font-style:italic;color:var(--gold3);font-size:14px;margin-top:4px}
.placeholder{display:flex;align-items:center;justify-content:center;height:100%;width:100%;background:radial-gradient(circle at 34% 28%,#FFFFFF,#F1E8DC 42%,#CDBBA3);color:#6B5640;font-family:var(--display);font-size:46px}
.newcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--gold2);border-radius:14px;background:transparent;color:var(--gold3);aspect-ratio:4/5;font-family:var(--display);font-size:20px}
.newcard span{font-size:38px;line-height:1;font-weight:300}
.newcard:hover{background:var(--paper)}
.empty{grid-column:1/-1;padding:40px 24px;text-align:center;color:var(--muted)}
.empty h3{font-size:26px;margin-bottom:6px}

/* ===== Calendário (página que cresce do mini) ===== */
.calbar{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.back{border:0;background:transparent;color:var(--gold);font-size:14px;letter-spacing:.06em;padding:6px 0}
.back:hover{color:var(--ink)}
.calwrap{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
@media (max-width:1000px){.calwrap{grid-template-columns:minmax(0,1fr)}}
.calcard{view-transition-name:calhero;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:0 14px 40px rgba(90,62,30,.08)}
.calhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
.calhead h2{font-size:clamp(32px,4vw,46px);line-height:1}
.calnav{display:flex;gap:8px;align-items:center}
.calscroll{overflow-x:auto}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px;border-top:1px solid var(--line)}
.wd{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);padding:10px 8px;border-bottom:1px solid var(--line)}
.day{min-height:116px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:4px;transition:background .15s}
.day:nth-child(7n){border-right:0}
.day.out .dn b{opacity:.35}
.day.over{background:var(--chip)}
.dn{display:flex;justify-content:space-between;align-items:center}
.dn b{font-family:var(--display);font-weight:400;font-size:17px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-variant-numeric:tabular-nums}
.day.today .dn b{background:var(--cafe2);color:var(--cafe-ink)}
.dn .add{opacity:0;border:0;background:transparent;color:var(--gold);width:26px;height:26px;border-radius:50%;font-size:18px;line-height:1}
.day:hover .add,.dn .add:focus-visible{opacity:1}
@media (hover:none){.dn .add{opacity:.6}}
.ev{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;border-left:2px solid var(--c);background:color-mix(in srgb, var(--c) 12%, var(--paper));color:var(--ink);border-radius:4px;padding:4px 7px;font-size:12.5px;line-height:1.3;cursor:grab}
.ev span.tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.ev svg{width:13px;height:13px;flex-shrink:0;opacity:.7}
.ev .h{font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
.ev.dragging{opacity:.4}
.cm{border:0;border-top:1px dashed var(--gold2);background:transparent;color:var(--gold3);font-family:var(--display);font-style:italic;font-size:12.5px;padding:3px 2px 0;text-align:left;line-height:1.25}
.cm:hover{color:var(--ink)}
.tray{margin-top:16px;padding:12px 14px;border:1px dashed var(--hair);border-radius:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;transition:background .15s}
.tray.over{background:var(--chip)}
.tray .ev{width:auto;max-width:240px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px}
/* lateral café: datas */
.cafe{position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 0%, #FFFDF8, var(--paper) 60%);border:1px solid var(--line);color:var(--ink);border-radius:22px;padding:24px 22px;box-shadow:0 14px 40px rgba(90,62,30,.08)}
.dates h3{font-size:26px;line-height:1.1}
.dlist{display:flex;flex-direction:column;margin-top:14px}
.dl{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.dl .dd b{display:block;font-family:var(--display);font-size:28px;font-weight:400;line-height:1;color:var(--gold3)}
.dl .dd span{font-size:10.5px;text-transform:uppercase;letter-spacing:.2em;color:var(--muted)}
.dl .n{font-family:var(--display);font-size:17px;line-height:1.25}
.dl .s{font-size:13px;color:var(--muted);margin-top:2px}
.agenda{display:flex;flex-direction:column;gap:22px}
.agenda .wk{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.arow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 0;width:100%;text-align:left;color:var(--ink)}
.arow .th{width:44px;height:55px;border-radius:7px;overflow:hidden;flex-shrink:0}
.arow .th img,.arow .th video{width:100%;height:100%;object-fit:cover;display:block}
.arow .th .placeholder{font-size:20px}
.arow .t{font-family:var(--display);font-size:18px;line-height:1.25}
.arow .when{font-size:13px;color:var(--muted)}

/* ===== 02 Feed (palco café) ===== */
.stage{position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(ellipse at 15% 0%, #FFFDF8 0%, var(--paper) 45%, var(--bg2) 100%);border:1px solid var(--line);color:var(--ink);padding:clamp(20px,4vw,48px)}
.stage::after{content:"";position:absolute;inset:auto -10% -60px -10%;height:160px;border-top:1px solid var(--gold2);border-radius:50%;transform:rotate(-3deg);opacity:.6;pointer-events:none}
.stage .pearl{z-index:0}
.feedwrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,410px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}

      <p class="tip">Os destaques da prévia vêm da seção 03.</p></div>
  </div></div></section>`;
  wirePhone($("#fphone"),"f");
  $$("[data-fm]").forEach(b=>b.onclick=()=>{ui.feedMode=b.dataset.fm;$$("[data-fm]").forEach(x=>x.setAttribute("aria-pressed",x===b));vt(()=>{$("#fphone").innerHTML=phoneInner("f")})});
  $("#labels").onchange=e=>{ui.labels=e.target.checked;$("#fphone").innerHTML=phoneInner("f")};
  const bc=()=>{const el=$("#biocnt"),b=$("#pf-bio");if(el&&b){const v=[...b.value].length;el.textContent=v+" / 150 caracteres";el.className="count"+(v>150?" over":"")}};bc();
  $$("[data-pf]").forEach(i=>i.oninput=()=>{const k=i.dataset.pf;queue("perfil/main",{[k]:k==="posts"?(+i.value||0):i.value});if(k==="bio")bc();$("#fphone").innerHTML=phoneInner("f")})}

/* ---------- 03 Destaques ---------- */
function hlRowHTML(){const a=dests().filter(d=>d.status!=="arquivar");return a.length?a.map(d=>`<div><i>${hlCover(d)}</i>${esc(d.nome)}</div>`).join(""):'<p class="tip">Nenhum destaque ativo.</p>'}
function vDest(){const all=dests(),act=all.filter(d=>d.status!=="arquivar"),arch=all.filter(d=>d.status==="arquivar");const w=writable(),ro=w?"":"readonly",dis=w?"":"disabled";
  const card=(d,i,list)=>{const s=d.stories||[],ok=s.filter(x=>x.ok).length,pct=s.length?Math.round(ok/s.length*100):0,len=[...(d.nome||"")].length;
    return `<article class="dcard ${d.status==="arquivar"?"arch":""}" data-did="${d.id}">
    <div class="dtop"><span class="ordn">${ROM[i]||i+1}</span><div class="dcv">${hlCover(d)}<button class="w-only" data-cv aria-label="Trocar capa de ${esc(d.nome)}" title="Trocar capa">✎</button></div>
      <div style="min-width:0"><input type="text" class="dname" data-k="nome" value="${esc(d.nome)}" aria-label="Nome do destaque" ${ro}><div class="cnt16 ${len>HLMAX?"over":""}">${len}/${HLMAX} caracteres visíveis</div></div>
      <div class="ord w-only"><button class="iconbtn" data-mvd="-1" ${i===0?"disabled":""} aria-label="Mover para a esquerda">‹</button><button class="iconbtn" data-mvd="1" ${i===list.length-1?"disabled":""} aria-label="Mover para a direita">›</button></div></div>
    <div class="dmeta"><select data-k="etapa" aria-label="Etapa da jornada" ${dis}>${ETAPAS.map(([k,n])=>`<option value="${k}" ${d.etapa===k?"selected":""}>Etapa: ${n}</option>`).join("")}</select>
      <select data-k="status" aria-label="Ação" ${dis}>${DST.map(([k,n])=>`<option value="${k}" ${d.status===k?"selected":""}>${n}</option>`).join("")}</select></div>
    <div><span class="lbl">Objetivo</span><textarea data-k="objetivo" rows="2" placeholder="O que a visitante deve sentir ou fazer depois de ver este destaque?" ${ro}>${esc(d.objetivo)}</textarea></div>
    <div><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="lbl" style="margin:0">Stories planejados</span><span class="cnt16">${ok} de ${s.length} prontos</span></div><div class="prog"><i style="width:${pct}%"></i></div></div>
    <div class="stories">${s.map((x,j)=>`<div class="sto ${x.ok?"ok":""}"><input type="checkbox" data-sk="${j}" ${x.ok?"checked":""} aria-label="Pronto" ${dis}><input type="text" data-st="${j}" value="${esc(x.t)}" aria-label="Story ${j+1}" ${ro}><button class="w-only" data-sd="${j}" aria-label="Remover story">✕</button></div>`).join("")}
      <div class="sto w-only"><span></span><input type="text" data-new placeholder="+ Adicionar story e Enter"><span></span></div></div>
    <div><span class="lbl">Chamada final</span><input type="text" data-k="cta" value="${esc(d.cta)}" placeholder="Ex.: Comenta MENTORIA" ${ro}></div>
    <div class="dfoot"><span class="chip">${ETN[d.etapa]||""}</span><button class="btn small danger w-only" data-del>Excluir</button></div></article>`};
  const cnt={};ETAPAS.forEach(([k])=>cnt[k]=act.filter(d=>d.etapa===k).length);
  view.innerHTML=head("Estratégia","A vitrine <i>do perfil</i>","Os destaques são a primeira coisa que quem chega vê. Cada um cumpre uma etapa da jornada, da primeira impressão até a mentoria.","",`<button class="btn primary w-only" id="newd">+ Novo destaque</button>`)+
  `<div class="vitrine"><div><span class="lbl">Como aparece no perfil, na ordem</span><div class="hlrow" id="hlrow">${hlRowHTML()}</div></div><div class="script">A vitrine de quem acabou de chegar.</div></div>
  <div class="journey">${ETAPAS.map(([k,n,s],i)=>`<div class="jstep"><span class="rn">${ROM[i]}</span><b>${n}</b><p>${s}</p><em>${cnt[k]} ${cnt[k]===1?"destaque":"destaques"}</em></div>`).join("")}</div>
  <div class="dgrid">${act.map((d,i)=>card(d,i,act)).join("")}</div>
  ${arch.length?`<div class="secsub"><h3>Para <i>arquivar ou juntar</i></h3><span class="tip">Saem da vitrine. O conteúdo pode ir para outro destaque.</span></div><div class="dgrid">${arch.map((d,i)=>card(d,i,arch)).join("")}</div>`:""}`;
  const nd=$("#newd");if(nd)nd.onclick=createDest;
  $$(".dcard").forEach(c=>{const id=c.dataset.did,path="destaques/"+id,d=()=>S.dest.get(id);
    $$("[data-k]",c).forEach(i=>{const k=i.dataset.k,isSel=i.tagName==="SELECT";i.addEventListener(isSel?"change":"input",()=>{queue(path,{[k]:i.value},isSel?0:600);
      if(k==="nome"){const n=[...i.value].length,ct=$(".cnt16",c);ct.textContent=n+"/"+HLMAX+" caracteres visíveis";ct.classList.toggle("over",n>HLMAX);$("#hlrow").innerHTML=hlRowHTML()}
      if(isSel){i.blur();vt(doRender)}})});
    $$("[data-sk]",c).forEach(i=>i.onchange=()=>{const s=(d().stories||[]).map(x=>Object.assign({},x));s[+i.dataset.sk].ok=i.checked;queue(path,{stories:s},0);render()});
    $$("[data-st]",c).forEach(i=>i.oninput=()=>{const s=(d().stories||[]).map(x=>Object.assign({},x));s[+i.dataset.st].t=i.value;queue(path,{stories:s})});
    $$("[data-sd]",c).forEach(b=>b.onclick=()=>{const s=(d().stories||[]).filter((_,j)=>j!==+b.dataset.sd);queue(path,{stories:s},0);render()});
    const nw=$("[data-new]",c);if(nw)nw.onkeydown=e=>{if(e.key==="Enter"&&nw.value.trim()){e.preventDefault();const s=(d().stories||[]).concat([{t:nw.value.trim(),ok:false}]);queue(path,{stories:s},0);nw.value="";nw.blur();doRender();setTimeout(()=>{const n2=$(`[data-did="${id}"] [data-new]`);if(n2)n2.focus()},40)}};
    $$("[data-mvd]",c).forEach(b=>b.onclick=()=>{const list=dests().filter(x=>(x.status==="arquivar")===(d().status==="arquivar"));const i=list.findIndex(x=>x.id===id),j=i+(+b.dataset.mvd);if(j<0||j>=list.length)return;
      const a=list[i],o=list[j],oa=a.ordem,ob=o.ordem;queue("destaques/"+a.id,{ordem:ob===oa?ob+(+b.dataset.mvd):ob},0);queue("destaques/"+o.id,{ordem:oa},0);vt(doRender)});
    const cv=$("[data-cv]",c);if(cv)cv.onclick=()=>pick(false,out=>{const im=out.find(x=>x.kind==="image");if(im){queue(path,{capa:{img:im.img}},0);render()}else toast("Use uma imagem como capa.")});
    const del=$("[data-del]",c);if(del)del.onclick=()=>{if(ui.armed!=="d"+id){ui.armed="d"+id;del.classList.add("armed");del.textContent="Confirmar exclusão";setTimeout(()=>{if(ui.armed==="d"+id){ui.armed=null;del.classList.remove("armed");del.textContent="Excluir"}},4000);return}ui.armed=null;deleteDest(id)}})}

/* ---------- Editor de post ---------- */
let lastFocus=null;
function openEditor(id,isNew){ui.sel=id;ui.es={slide:0,full:false};ui.armed=null;lastFocus=document.activeElement;buildDrawer();
  scrim.hidden=false;drawer.removeAttribute("inert");drawer.setAttribute("aria-hidden","false");requestAnimationFrame(()=>{scrim.classList.add("open");drawer.classList.add("open")});
  setTimeout(()=>{const t=$(".ttl",drawer);if(t){t.focus({preventScroll:true});if(isNew)t.select()}},isNew?460:0)}
function closeEditor(){if(!ui.sel)return;flushAll();ui.sel=null;scrim.classList.remove("open");drawer.classList.remove("open");drawer.setAttribute("inert","");drawer.setAttribute("aria-hidden","true");
  setTimeout(()=>{if(!ui.sel){scrim.hidden=true;drawer.innerHTML=""}},460);if(lastFocus&&lastFocus.isConnected)lastFocus.focus({preventScroll:true});render();renderMini()}
scrim.onclick=closeEditor;
addEventListener("keydown",e=>{if(e.key==="Escape"&&ui.sel)closeEditor()});
function buildDrawer(){const p=S.posts.get(ui.sel);if(!p){closeEditor();return}const w=writable(),dis=w?"":"disabled",ro=w?"":"readonly";
  drawer.dataset.sig="";
  drawer.innerHTML=`<div class="dhead"><span class="eyebrow">${esc(TIPN[p.tipo]||"Post")}${p.pilar?" · "+esc(p.pilar):""}</span><input class="ttl" type="text" data-f="titulo" value="${esc(p.titulo)}" aria-label="Título do post" ${ro}>
    <div class="r"><span class="saving" id="saving"></span><button class="btn small danger w-only" id="delp">Excluir</button><button class="iconbtn" id="closep" aria-label="Fechar editor">✕</button></div></div>
  <div class="dbody"><div class="fields">
    <section class="blk"><span class="bn">01</span><div class="bc"><h4>Formato e <i style="color:var(--gold3)">agenda</i></h4>
      <div class="tseg" role="group" aria-label="Formato">${TIPOS.map(([k,n])=>`<button data-tipo="${k}" aria-pressed="${p.tipo===k}" ${dis}>${ICON[k]}${n}</button>`).join("")}</div>
      <div class="grid3"><div><label class="lbl" for="f-st">Status</label><select id="f-st" data-f="status" ${dis}>${STATUS.map(([k,n])=>`<option value="${k}" ${p.status===k?"selected":""}>${n}</option>`).join("")}</select></div>
        <div><label class="lbl" for="f-data">Data</label><input type="date" id="f-data" data-f="data" value="${esc(p.data)}" ${ro}></div>
        <div><label class="lbl" for="f-hora">Horário</label><input type="time" id="f-hora" data-f="hora" value="${esc(p.hora)}" ${ro}></div></div>
      <div><label class="lbl" for="f-pilar">Pilar de conteúdo</label><select id="f-pilar" data-f="pilar" ${dis}><option value="">Sem pilar</option>${PILARES.map(x=>`<option ${p.pilar===x?"selected":""}>${esc(x)}</option>`).join("")}</select></div></div></section>
    <section class="blk"><span class="bn">02</span><div class="bc"><h4>Arquivos</h4><div id="mbox"></div>
      <div><label class="lbl" for="f-drive">Original no Google Drive</label><div class="drive"><input type="url" id="f-drive" data-f="drive" value="${esc(p.drive)}" placeholder="Cole o link da pasta ou do arquivo" ${ro}><a class="btn small" id="drivego" href="${esc(/^https?:\/\//.test(p.drive||"")?p.drive:"#")}" target="_blank" rel="noopener" ${/^https?:\/\//.test(p.drive||"")?"":"hidden"}>Abrir</a></div></div></div></section>
    <section class="blk"><span class="bn">03</span><div class="bc"><h4>Legenda</h4><textarea id="f-leg" data-f="legenda" rows="11" aria-label="Legenda" ${ro}>${esc(p.legenda)}</textarea>
      <div class="capfoot"><span class="count" id="lcnt"></span><button class="btn small" id="copyl">Copiar legenda</button></div>
      <div><span class="lbl">Aparece antes do “mais”</span><div class="fold" id="fold"></div></div></div></section>
    <section class="blk"><span class="bn">04</span><div class="bc"><h4>Notas internas</h4><textarea id="f-notas" data-f="notas" rows="3" aria-label="Notas internas" placeholder="Referências, roteiro, pedidos da Dani…" ${ro}>${esc(p.notas)}</textarea></div></section>
  </div><div class="prevcol"><span class="lbl">Prévia do post</span><div class="phone mini2" id="ephone">${phoneInner("e")}</div></div></div>`;
  $("#closep").onclick=closeEditor;wirePhone($("#ephone"),"e");
  const path="posts/"+p.id,instant=i=>i.tagName==="SELECT"||i.type==="date"||i.type==="time";
  $$("[data-f]",drawer).forEach(i=>{const k=i.dataset.f;i.addEventListener(instant(i)?"change":"input",()=>{
    queue(path,{[k]:i.value},instant(i)?0:600);
    if(k==="legenda"){meta();refreshPrev()}if(k==="drive"){const ok=/^https?:\/\//.test(i.value);const a=$("#drivego");a.hidden=!ok;a.href=ok?i.value:"#"}
    if(k==="data"||k==="hora")refreshPrev();if(k==="pilar"){const e=$(".dhead .eyebrow",drawer);if(e)e.textContent=(TIPN[S.posts.get(p.id).tipo]||"Post")+(i.value?" · "+i.value:"")}
    if(["titulo","status","data","hora","pilar"].includes(k)){render();renderMini()}})});
  $$("[data-tipo]",drawer).forEach(b=>b.onclick=()=>{queue(path,{tipo:b.dataset.tipo},0);$$("[data-tipo]",drawer).forEach(x=>x.setAttribute("aria-pressed",x===b));mbox();refreshPrev();render()});
  $("#copyl").onclick=()=>{const t=S.posts.get(p.id).legenda||"";const fb=()=>{const ta=$("#f-leg");ta.focus();ta.select();toast("Texto selecionado: copie com Ctrl+C ou segure para copiar")};
    try{navigator.clipboard.writeText(t).then(()=>toast("Legenda copiada"),fb)}catch(_){fb()}};
  const del=$("#delp");del.onclick=()=>{if(ui.armed!=="p"){ui.armed="p";del.classList.add("armed");del.textContent="Confirmar exclusão";setTimeout(()=>{if(ui.armed==="p"){ui.armed=null;del.classList.remove("armed");del.textContent="Excluir"}},4000);return}ui.armed=null;deletePost(p.id)};
  mbox();meta()}
function meta(){const p=S.posts.get(ui.sel);if(!p)return;const n=[...(p.legenda||"")].length,c=$("#lcnt");if(c){c.textContent=n+" / "+LIMIT+" caracteres";c.className="count"+(n>LIMIT?" over":"")}
  const f=$("#fold");if(f){const t=(p.legenda||"").replace(/\n+/g," ");f.textContent=t?(t.length>FOLD?t.slice(0,FOLD).trim()+"…":t):"Escreva a legenda para ver o início dela aqui."}}
function refreshPrev(){const b=$("#ephone");if(b)b.innerHTML=phoneInner("e")}
function mbox(){const box=$("#mbox");if(!box)return;const p=S.posts.get(ui.sel),ms=p.midias||[],w=writable(),path="posts/"+p.id;
  drawer.dataset.sig=JSON.stringify([p.midias,p.capa,p.tipo]);
  const set=(arr,extra)=>{queue(path,Object.assign({midias:arr},extra||{}),0);mbox();refreshPrev();render()};
  box.innerHTML=`${ms.length?`<div class="mgrid">${ms.map((m,i)=>`<div class="mi">${m.kind==="video"?`<video src="${esc(src(m))}#t=0.5" muted playsinline preload="metadata"></video>`:`<img src="${esc(src(m))}" alt="">`}<span class="n">${i+1}</span>
    ${w?`<div class="ctl"><button data-ml="${i}" ${i===0?"disabled":""} aria-label="Mover para trás">‹</button><button data-mx="${i}" aria-label="Remover arquivo">✕</button><button data-mr="${i}" ${i===ms.length-1?"disabled":""} aria-label="Mover para frente">›</button></div>`:""}</div>`).join("")}</div>`:""}
    ${p.tipo==="reel"?`<div style="display:flex;gap:14px;align-items:center;margin-top:12px"><div class="mi" style="width:72px;flex-shrink:0">${p.capa?`<img src="${esc(src(p.capa))}" alt="Capa do Reels">`:'<div class="placeholder" style="font-size:12px;font-family:var(--ui)">sem capa</div>'}</div>
      <div><div style="font-family:var(--display);font-size:17px">Capa do Reels</div><p class="tip">A imagem que aparece na grade do perfil.</p>${w&&assets?`<button class="btn small" id="capab" style="margin-top:6px">${p.capa?"Trocar capa":"Enviar capa"}</button>`:""}${w&&p.capa?` <button class="btn small ghost" id="capax">Remover</button>`:""}</div></div>`:""}
    ${w?(assets?`<div class="drop" id="drop" style="margin-top:12px"><b>Arraste as imagens para cá</b><button class="btn small" id="addm">Escolher imagens</button><span class="tip">Dica: escolha direto da pasta do Google Drive no seu computador. Vídeos ficam no Drive: cole o link no campo abaixo.</span></div>`:""):(ms.length?"":'<p class="tip">Nenhum arquivo neste post.</p>')}`;
  $$("[data-ml]",box).forEach(b=>b.onclick=()=>{const a=ms.slice(),i=+b.dataset.ml;[a[i-1],a[i]]=[a[i],a[i-1]];set(a)});
  $$("[data-mr]",box).forEach(b=>b.onclick=()=>{const a=ms.slice(),i=+b.dataset.mr;[a[i+1],a[i]]=[a[i],a[i+1]];set(a)});
  $$("[data-mx]",box).forEach(b=>b.onclick=()=>{dropFiles([ms[+b.dataset.mx]]);const a=ms.filter((_,j)=>j!==+b.dataset.mx);ui.es.slide=0;set(a)});
  const add=$("#addm");if(add)add.onclick=()=>pick(true,out=>{const cur=(S.posts.get(p.id).midias||[]).concat(out);set(cur,p.tipo==="carrossel"&&cur.length===1&&cur[0].kind==="video"?{tipo:"reel"}:null)});
  const dz=$("#drop");if(dz){dz.addEventListener("dragover",e=>{if(![...e.dataTransfer.types].includes("Files"))return;e.preventDefault();dz.classList.add("over")});dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
    dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");if(e.dataTransfer.files.length)uploadFiles(e.dataTransfer.files,out=>set((S.posts.get(p.id).midias||[]).concat(out)))})}
  const cb=$("#capab");if(cb)cb.onclick=()=>pick(false,out=>{const im=out.find(x=>x.kind==="image");if(im){if(p.capa)dropFiles([p.capa]);queue(path,{capa:{img:im.img}},0);mbox();refreshPrev();render()}else toast("Use uma imagem como capa.")});
  const cx=$("#capax");if(cx)cx.onclick=()=>{queue(path,{capa:null},0);mbox();refreshPrev();render()}}
function syncDrawer(){const p=S.posts.get(ui.sel);if(!p){if(ui.sel){toast("Este post foi excluído.");closeEditor()}return}if(pending["posts/"+p.id])return;
  $$("[data-f]",drawer).forEach(i=>{if(i===document.activeElement)return;const v=p[i.dataset.f]==null?"":p[i.dataset.f];if(i.value!==String(v))i.value=v});
  $$("[data-tipo]",drawer).forEach(x=>x.setAttribute("aria-pressed",x.dataset.tipo===p.tipo));
  if(drawer.dataset.sig!==JSON.stringify([p.midias,p.capa,p.tipo]))mbox();meta();refreshPrev()}

/* ---------- conexão ---------- */
function merge(map,snap,col){const m=new Map();snap.docs.forEach(d=>{const p=pending[col+"/"+d.id];m.set(d.id,Object.assign({id:d.id},d.data(),p||{}))});
  creating.forEach(id=>{if(!m.has(id)&&map.has(id))m.set(id,map.get(id))});return m}
let loadT=null;
function onData(){if(ui.sel)syncDrawer();render();renderMini();setLive()}
function subscribe(){loadT=setTimeout(()=>{if(!S.live){S.failed=true;setLive();render()}},10000);
  const live=md=>{if(!md.fromCache&&!S.live){S.live=true;S.failed=false;clearTimeout(loadT);setLive()}};
  const err=e=>{if(e&&e.code==="permission-denied")toast("As regras do banco ainda não liberam a leitura. Publique as regras do Firestore.");S.failed=true;setLive();render()};
  db.collection("posts").onSnapshot(s=>{S.posts=merge(S.posts,s,"posts");S.loaded.posts=true;live(s.metadata);onData()},err);
  db.collection("destaques").onSnapshot(s=>{S.dest=merge(S.dest,s,"destaques");S.loaded.dest=true;onData()},err);
  db.doc("perfil/main").onSnapshot(s=>{S.perfilExists=s.exists;S.perfil=s.exists?Object.assign({},s.data(),pending["perfil/main"]||{}):(S.perfil||null);S.loaded.perfil=true;onData()},err)}
route();applyRole();setLive();renderMini(true);
addEventListener("beforeunload",flushAll);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushAll()});
function startFirebase(){if(!window.firebase){db=null;render();setLive();return}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();}catch(e){db=null;render();setLive();return}
  assets=true;applyRole();setLive();subscribe();render();
  const auth=firebase.auth(),dlg=$("#login");
  auth.onAuthStateChanged(u=>{user=u;applyRole();render();if(ui.sel)buildDrawer()});
  $("#authbtn").onclick=()=>{if(user){auth.signOut().then(()=>toast("Você saiu. Agora o app está só para visualização."));return}$("#lg-err").textContent="";dlg.showModal();setTimeout(()=>$("#lg-email").focus(),50)};
  $("#lg-cancel").onclick=()=>dlg.close();
  $("#loginf").onsubmit=e=>{e.preventDefault();const go=$("#lg-go");go.disabled=true;$("#lg-err").textContent="";
    auth.signInWithEmailAndPassword($("#lg-email").value.trim(),$("#lg-pass").value).then(()=>{dlg.close();$("#lg-pass").value="";toast("Pronto, você pode editar.")})
    .catch(er=>{const c=er&&er.code;$("#lg-err").textContent=c==="auth/too-many-requests"?"Muitas tentativas. Espere alguns minutos.":c==="auth/network-request-failed"?"Sem conexão. Verifique a internet.":"E-mail ou senha incorretos."}).finally(()=>{go.disabled=false})}}
startFirebase();
})();
</script>
